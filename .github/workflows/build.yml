name: Build Bluetooth Toy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q BluetoothToy_GitHub_Build_Ready.zip -d project
          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -100

      - name: Find Android project
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -o -name settings.gradle | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project settings.gradle file was not found."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace
    .- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: Bluetooth-Toy-APK
    path: app/build/outputs/apk/debug/*.apk
